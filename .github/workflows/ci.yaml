name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install sandbox system dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep libseccomp-dev

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Pin npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.2 --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Verify dependency security
        run: |
          npm audit
          npm audit signatures

      - name: Run typecheck
        run: npm run typecheck

      - name: Run linting
        run: npm run lint:ci

      - name: Run tests
        run: npm test

      - name: Verify dist directory exists
        run: |
          if [ ! -d "dist" ]; then
            echo "Error: dist directory not found"
            exit 1
          fi
